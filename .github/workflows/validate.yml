name: validate

on:
  push:
    branches: [main]
  pull_request:

# No AWS credentials in CI, ever. Green main IS the release gate
# (release.yml builds the binaries). Collectors are pure API clients.
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: gofmt -l . | tee /dev/stderr | (! read)
      - run: go vet ./...
      - run: go test ./...
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cd python && python -m unittest discover -v
