name: validate

on:
  push:
    branches: [main]
  pull_request:

# The job named `validate` is the check the `main` ruleset requires.
# Rename both together or merges stop.
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# No AWS credentials in CI, ever. Green main IS the release gate
# (release.yml builds the binaries). Collectors are pure API clients.
#
# Least privilege (issue #5): the token can read the repository and
# nothing else, and no job leaves it in .git/config. Actions are pinned
# to full commit SHAs, the tag each was in the comment beside it (see
# release.yml for how to move one).
permissions: {}
jobs:
  go:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24"
      - run: gofmt -l . | tee /dev/stderr | (! read)
      - run: go vet ./...
      # ./... skips testdata; the fake release the fallback tests build
      # is vetted by name.
      - run: go vet ./internal/v2/testdata/fakecollector
      - run: go test ./...
  shell:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # dash is Debian's POSIX sh and the closest stand-in for BusyBox
      # ash on Synology DSM: run the supervisor tests under both.
      - run: sudo apt-get install -y --no-install-recommends dash
      - run: sh scripts/test-run-forever.sh
      - run: SH=dash dash scripts/test-run-forever.sh
      - run: sh scripts/test-next-version.sh
      - run: sh scripts/test-install.sh
      - run: SH=dash sh scripts/test-install.sh
      - run: sh scripts/test-workflows.sh
  # The updater's Windows rename path and the macOS symlink handling
  # only run on those hosts (issue #6), so the Go tests run there too.
  # So does the fallback's end-to-end test (internal/v2/fallback_test.go):
  # real binaries crash, restart and roll back, which on Windows renames
  # a running .exe aside.
  go-platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24"
      - run: go vet ./...
      - run: go test ./...
  # install.ps1's user-only .env ACL, on a real Windows host, under both
  # Windows PowerShell 5.1 and pwsh. Also the run-collector.cmd wrapper,
  # which restores collector.exe from collector.exe.prev after a power
  # cut mid-swap, and the download-and-verify block as a release
  # publishes it, pinned to its own tag and checksums (issue #5).
  windows-acl:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/test-install-acl.ps1
      - run: pwsh -NoProfile -File scripts/test-install-acl.ps1
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/test-install-wrapper.ps1
      - run: pwsh -NoProfile -File scripts/test-install-wrapper.ps1
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/test-install-verify.ps1
      - run: pwsh -NoProfile -File scripts/test-install-verify.ps1
  # The hardened systemd unit under real systemd: it must start the
  # collector, let it tighten .env and self-update in place, roll back a
  # release that crashes at startup, and stop on exit 2. Loopback only;
  # no token, no hub. On x86_64 and arm64 (the Pi and ARM-VM fleet).
  systemd:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24"
      - run: sh scripts/test-systemd-unit.sh
  # The one required check: green only when every job above passed, so
  # the ruleset names one check however the jobs above change. A job
  # added above must join `needs:` here. No job anywhere else may also
  # be named `validate`.
  validate:
    name: validate
    if: always()
    needs: [go, shell, go-platforms, windows-acl, systemd]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: every job passed
        run: test "${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped') }}" = true
