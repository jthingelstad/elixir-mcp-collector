name: validate

on:
  push:
    branches: [main]
  pull_request:

# No AWS credentials in CI, ever. Green main IS the release gate
# (release.yml builds the binaries). Collectors are pure API clients.
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24"
      - run: gofmt -l . | tee /dev/stderr | (! read)
      - run: go vet ./...
      - run: go test ./...
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # dash is Debian's POSIX sh and the closest stand-in for BusyBox
      # ash on Synology DSM: run the supervisor tests under both.
      - run: sudo apt-get install -y --no-install-recommends dash
      - run: sh scripts/test-run-forever.sh
      - run: SH=dash dash scripts/test-run-forever.sh
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: cd python && python -m unittest discover -v
