# Release pipeline (GO-PORT §3): every green push to main publishes a
# GitHub Release with four platform binaries + SHA256SUMS. Collectors
# self-update from these; a red test = no release = fleet unchanged.
name: release
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24"
      - run: go vet ./... && go test ./...
      - name: build matrix
        run: |
          set -euo pipefail
          # v3.0.x since 2026-09-26. The major used to follow the
          # config/lease/submit contract: 2 was the zero-trust client
          # generation, and the door's min_client_version still gates on
          # these numbers. The contract has not changed; the client
          # around it has, enough to be a generation of its own: Go only
          # (the Python twin is gone), an updater that rolls back a
          # release that cannot start, and releases that are signed and
          # verified before they run. Move the major again for a change
          # of that size, or when the contract itself changes.
          # The patch is the next one no tag has used
          # (scripts/next-version.sh): the merge that moved the major
          # built exactly v3.0.0, each green push after it builds the
          # next, nobody tags by hand, and a number is never reused.
          # Every v3 is above every v2.0.x, which is how the hub
          # compares; the script refuses to build a version that is not
          # above every release tag.
          VERSION="$(git ls-remote --tags --refs "${{ github.server_url }}/${{ github.repository }}" \
            | sh scripts/next-version.sh 3 0)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p dist
          build() {
            GOOS=$1 GOARCH=$2 GOARM=${3:-} CGO_ENABLED=0 \
              go build -trimpath -ldflags "-s -w -X main.version=$VERSION" \
              -o "dist/collector_$4" ./cmd/collector
          }
          build darwin arm64 ""  darwin_arm64
          build darwin amd64 ""  darwin_amd64
          build linux  arm64 ""  linux_arm64
          build linux  amd64 ""  linux_amd64
          build linux  arm   "7" linux_armv7
          build windows amd64 "" windows_amd64.exe
          build windows arm64 "" windows_arm64.exe
          (cd dist && shasum -a 256 collector_* > SHA256SUMS)
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Published as a PRERELEASE on purpose. Every green push builds
          # one, so a build existing says nothing about whether anyone
          # should run it. Elixir MCP promotes a release to Latest at the
          # moment it names it as the update authority, and
          # `releases/latest` is what install.sh and the README hand a new
          # operator - so a fresh install gets the version the fleet is
          # actually on, never an unsoaked build.
          # One printf, no heredoc: a heredoc terminator inside a YAML
          # block scalar depends on how the block strips indentation, and
          # an unindented line ends the block and breaks the whole file.
          printf '%s\n' \
            "Candidate build from green main (${{ github.sha }})." \
            "" \
            "Not yet named as the update authority, so no collector installs it." \
            "When Elixir MCP names this version, this release is promoted to Latest." \
            > notes.md
          gh release create "$VERSION" dist/* \
            --title "$VERSION" \
            --prerelease \
            --notes-file notes.md
