# Weekly PRs for the pinned GitHub Actions. The Go module has no
# dependencies, so the Actions are all there is to watch. Dependabot
# keeps the SHA pins and their tag comments in step, and each PR goes
# through main's required checks like any other change.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
