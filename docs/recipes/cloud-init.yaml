#cloud-config
# Elixir MCP collector - one paste at instance creation, and the box
# comes up collecting. Works on any Linux cloud VM with cloud-init
# (Oracle Linux 9, Ubuntu, Debian, Rocky, Fedora...): it needs curl, a
# sha256 tool, systemd and ssh-keygen from OpenSSH 8.1 or newer, all of
# which those images have (Oracle Linux 8's OpenSSH 8.0 is too old).
#
# Before pasting, replace the two secrets in .env below. That is the
# whole configuration - everything else the server hands the collector
# at startup. Read docs/recipes/cloud-init.md for the two caveats
# (secrets in user data are readable from inside the instance; the
# installer is checked against the release signature before it runs).

# Keep the image's default login user (on Ubuntu, listing users without
# `default` silently removes it and you lose SSH). The collector runs
# as its own unprivileged system user.
users:
  - default
  - name: collector
    system: true
    shell: /usr/sbin/nologin
    homedir: /opt/elixir-collector
    no_create_home: true

write_files:
  # The two secrets, mode 600, owned by the collector after runcmd
  # (write_files runs before users exist on most images, so ownership
  # is fixed below rather than declared here).
  - path: /opt/elixir-collector/.env
    permissions: "0600"
    content: |
      CR_API_TOKEN=REPLACE_WITH_YOUR_CLASH_ROYALE_KEY
      ELIXIR_API_TOKEN=emcg_REPLACE_WITH_YOUR_COLLECTOR_TOKEN

  # systemd supervision: restart on crash, on the self-update exit, and
  # on the watchdog exit - but not on exit 2, which means the .env will
  # never work and restarting cannot fix it.
  - path: /etc/systemd/system/elixir-collector.service
    permissions: "0644"
    content: |
      [Unit]
      Description=Elixir MCP collector
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=simple
      User=collector
      WorkingDirectory=/opt/elixir-collector
      ExecStart=/opt/elixir-collector/collector
      Restart=always
      RestartSec=5
      RestartPreventExitStatus=2
      # Hardening, the same set as scripts/elixir-collector.service
      # (which explains each line). The collector holds two secrets and
      # talks to three HTTPS hosts; it needs nothing else on the box.
      # Its own directory stays writable because self-update swaps the
      # binary in place.
      NoNewPrivileges=true
      UMask=0077
      ProtectSystem=strict
      ProtectHome=true
      ReadWritePaths=/opt/elixir-collector
      PrivateTmp=true
      PrivateDevices=true
      ProtectKernelTunables=true
      ProtectKernelModules=true
      ProtectKernelLogs=true
      ProtectControlGroups=true
      ProtectClock=true
      ProtectHostname=true
      ProtectProc=invisible
      CapabilityBoundingSet=
      AmbientCapabilities=
      RestrictSUIDSGID=true
      RestrictNamespaces=true
      RestrictRealtime=true
      RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
      LockPersonality=true
      MemoryDenyWriteExecute=true
      SystemCallFilter=@system-service
      SystemCallErrorNumber=EPERM

      [Install]
      WantedBy=multi-user.target

runcmd:
  # The installer comes from the release Elixir MCP currently names
  # (Latest), and runs only once the release's SHA256SUMS verifies
  # against the release key below and the installer against SHA256SUMS
  # (issue #5). It installs its own release's binary, checked against
  # checksums baked into it; once running, the binary self-updates to
  # whatever the server names. Set TAG to a release (v3.0.0) instead of
  # "latest" to reproduce one install exactly.
  - |
    set -eu
    TAG="latest"
    KEY="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFvN1mZGTcFXSGnIXf8h33cxAhvrHPYn80BO5FkELh28"
    case "$TAG" in
      latest) base="https://github.com/jthingelstad/elixir-mcp-collector/releases/latest/download" ;;
      *) base="https://github.com/jthingelstad/elixir-mcp-collector/releases/download/$TAG" ;;
    esac
    cd /opt/elixir-collector
    curl -fsSL -O "$base/install.sh" -O "$base/SHA256SUMS" -O "$base/SHA256SUMS.sig"
    echo "elixir-mcp-collector-release $KEY" > allowed_signers
    ssh-keygen -Y verify -f allowed_signers -I elixir-mcp-collector-release \
      -n elixir-mcp-collector-release -s SHA256SUMS.sig < SHA256SUMS
    grep ' install.sh$' SHA256SUMS | sha256sum -c -
    sh install.sh
    rm -f install.sh SHA256SUMS SHA256SUMS.sig allowed_signers
    chown -R collector:collector /opt/elixir-collector
    chmod 600 /opt/elixir-collector/.env
    systemctl daemon-reload
    systemctl enable --now elixir-collector
    # The doctor's verdict is the last thing in the cloud-init log
    # (`sudo cat /var/log/cloud-init-output.log`). Releases before
    # doctor existed would start collecting in the foreground here
    # instead, so the binary is asked first whether it has one.
    if grep -q "Elixir MCP Collector doctor" /opt/elixir-collector/collector; then
      runuser -u collector -- /opt/elixir-collector/collector doctor || true
    else
      echo "this collector release has no doctor; check with: systemctl status elixir-collector"
    fi
